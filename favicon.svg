<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <style>
    .cabeca { animation: m 4s ease-in-out infinite alternate; transform-origin: 100px 175px; }
    .olho { animation: p 3.5s infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes m { 0% { transform: rotate(-4deg); } 100% { transform: rotate(4deg); } }
    @keyframes p { 0%, 90%, 100% { transform: scaleY(1); } 93%, 95% { transform: scaleY(0.05); } }
  </style>
  <g class="cabeca">
    <path fill="#f6d353" d="M 100 25 C 125 25 140 40 148 50 C 175 45 185 75 175 105 C 185 130 160 160 125 155 C 115 158 85 158 75 155 C 40 160 15 130 25 105 C 15 75 25 45 52 50 C 60 40 75 25 100 25 Z"/>
    <rect x="70" y="166" width="60" height="12" rx="6" fill="#f6d353"/>
    <rect class="olho" x="76" y="75" width="14" height="38" rx="7" fill="#0a0a0c"/>
    <rect class="olho" x="110" y="75" width="14" height="38" rx="7" fill="#0a0a0c"/>
  </g>
</svg>
